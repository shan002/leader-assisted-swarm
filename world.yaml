type: "RectangularWorld"
size: [10, 10]
time_step: !np 1/50
seed: 1

metadata:
  protected_point: [1.0, 5.0]
  protected_radius: 0.2

spawners:
  - name: "evader_spawner"
    type: "ProtectedPointSpawner"
    region: [[8.8, 1.0], [9.2, 1.0], [9.2, 9.0], [8.8, 9.0]]
    n: 1
    avoid_overlap: true
    mode: "oneshot"
    agent:
      name: "evader"
      type: "MazeAgent"
      team: "evader"
      agent_radius: 0.1
      body_filled: true
      body_color: [0, 100, 255]
      controller:
        type: "StaticController"
        output: [0.08, 0.0]

  - name: "defender_swarm"
    type: "UniformAgentSpawner"
    region: [[4, 1], [6, 1], [6, 3], [4, 3]]
    n: 6
    facing: "away"
    avoid_overlap: true
    mode: "oneshot"
    agent:
      type: "MazeAgent"
      team: "defender"
      agent_radius: 0.1
      body_filled: true
      body_color: [255, 0, 0]
      sensors:
        - type: "BinaryFOVSensor"
          theta: 0.45
          distance: 1.0
      controller:
        type: "BinaryController"
        sensor_id: 0
        a: [0.276, 0.602]
        b: [0.276, -0.602]

  - name: "leader_spawner"
    type: "UniformAgentSpawner"
    region: [[4, 1], [6, 1], [6, 3], [4, 3]]
    n: 1
    facing: "away"
    avoid_overlap: true
    mode: "oneshot"
    agent:
      name: "leader"
      type: "MazeAgent"
      team: "leader"
      agent_radius: 0.1
      body_filled: true
      body_color: [0, 255, 0]
      controller:
        type: "LeaderController"
        max_speed: 0.1
        max_turn_rate: 1.5
