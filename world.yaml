type: "RectangularWorld"
size: [10, 10]
time_step: !np 1/50
seed: 1

metadata:
  start: [1.5, 5.0]
  target: [8.0, 5.0]
  # Finalize automatically when the current score reaches this value or lower.
  stop_score: 0.2

spawners:
  - name: "defender_swarm"
    type: "UniformAgentSpawner"
    region: [[1, 4], [2, 4], [2, 6], [1, 6]]
    n: 6
    facing: "away"
    avoid_overlap: true
    mode: "oneshot"
    agent:
      type: "MazeAgent"
      team: "defender"
      agent_radius: 0.1
      body_filled: true
      body_color: [255, 0, 0]
      sensors:
        - type: "BinaryFOVSensor"
          theta: 0.45
          distance: 1.0
      controller:
        type: "BinaryController"
        a: [0.276, 0.602]
        b: [0.276, -0.602]

  - name: "leader_spawner"
    type: "UniformAgentSpawner"
    region: [[1, 4], [2, 4], [2, 6], [1, 6]]
    n: 1
    facing: "away"
    avoid_overlap: true
    mode: "oneshot"
    agent:
      name: "leader"
      type: "MazeAgent"
      team: "leader"
      agent_radius: 0.1
      body_filled: true
      body_color: [0, 255, 0]
      controller:
        type: "LeaderController"
        max_speed: 0.1
        max_turn_rate: 1.5
